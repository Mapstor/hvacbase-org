<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three-phase power: three voltage waves 120 degrees apart</title>
  <desc id="d">Three sine waves, phases A, B and C, offset by 120 degrees; in a balanced system the total power stays steady. Apparent power in kVA equals voltage times current times the square root of 3, divided by 1,000; real power in kW also multiplies by the power factor.</desc>
