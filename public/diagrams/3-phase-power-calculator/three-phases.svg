  <text class="num" x="544" y="88">Power from three phases</text>
  <text class="cap" x="544" y="112">kVA = V × I × √3 ÷ 1,000</text>
  <text class="cap" x="544" y="134">kW = V × I × √3 × PF ÷ 1,000</text>
  <text class="cap" x="544" y="158">V is line-to-line voltage,</text>
  <text class="cap" x="544" y="176">I the line current and</text>
  <text class="cap" x="544" y="194">PF the power factor</text>
  <text class="cap" x="32" y="316">In a balanced three-phase system, total power is steady from moment to moment; single-phase power pulses.</text>
