<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Heat pump heating capacity at 47, 17 and 5 degrees, standard versus cold-climate</title>
  <desc id="d">Heating capacity as a share of the rating at 47 degrees: a standard heat pump keeps about 60 percent at 17 degrees and 40 percent at 5 degrees; a cold-climate heat pump keeps about 79 percent at 17 degrees and 70 percent at 5 degrees, the ENERGY STAR cold-climate minimum.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .trace{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 1.8s ease-out}
    @keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.trace{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="340" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">How much heating capacity a heat pump keeps in the cold</text>
  <path d="M110 274 H670" stroke="#9fb3c4" stroke-width="1" fill="none"/>
  <path d="M110 64 V274" stroke="#9fb3c4" stroke-width="1" fill="none"/>
  <polyline class="trace" points="636,90 300,145 166,169" fill="none" stroke="#2b7bb9" stroke-width="3"/>
  <polyline class="trace" points="636,90 300,195 166,248" fill="none" stroke="#e07a2f" stroke-width="3"/>
  <circle cx="636" cy="90" r="4" fill="#e07a2f"/>
  <circle cx="300" cy="195" r="4" fill="#e07a2f"/>
  <circle cx="166" cy="248" r="4" fill="#e07a2f"/>
  <circle cx="300" cy="145" r="4" fill="#2b7bb9"/>
  <circle cx="166" cy="169" r="4" fill="#2b7bb9"/>
  <text class="num" x="174" y="161">70%</text>
  <text class="num" x="308" y="137">79%</text>
  <text class="num" x="308" y="213">60%</text>
  <text class="num" x="174" y="252">40%</text>
  <text class="num" x="590" y="80">100% at 47°F</text>
  <text class="cap" x="154" y="294">5°F</text>
  <text class="cap" x="288" y="294">17°F</text>
  <text class="cap" x="624" y="294">47°F</text>
  <text class="cap" x="32" y="94">Rated</text>
  <rect x="560" y="186" width="14" height="4" rx="1" fill="#2b7bb9" stroke="none"/>
  <text class="cap" x="580" y="192">Cold-climate heat pump</text>
  <rect x="560" y="212" width="14" height="4" rx="1" fill="#e07a2f" stroke="none"/>
  <text class="cap" x="580" y="218">Standard heat pump</text>
  <text class="cap" x="32" y="320">Share of rated capacity, as modeled in the calculator. 70% at 5°F is ENERGY STAR's cold-climate minimum.</text>
</svg>
