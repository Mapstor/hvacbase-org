<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 354" width="800" height="354" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Annual cooling cost by SEER2 rating, showing diminishing returns</title>
  <desc id="d">Annual cooling cost for a 3-ton system at 1,500 hours and 18 cents per kWh falls from $725 at 13.4 SEER2 to $572 at 17 and $442 at 22. Going from 13.4 to 14.3 saves $45 a year, while going from 20 to 22, more than twice the rating change, saves $44.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .trace{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 1.8s ease-out}
    @keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.trace{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="354" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Each extra SEER2 point saves less</text>
  <path d="M90 270 H690" stroke="#9fb3c4" stroke-width="1" fill="none"/>
  <path d="M90 70 V270" stroke="#9fb3c4" stroke-width="1" fill="none"/>
  <polyline class="trace" points="115,89 172,114 229,137 279,154 343,174 406,192 532,222 658,247" fill="none" stroke="#2b7bb9" stroke-width="3"/>
  <circle cx="115" cy="89" r="4" fill="#2b7bb9"/>
  <circle cx="172" cy="114" r="4" fill="#2b7bb9"/>
  <circle cx="229" cy="137" r="4" fill="#2b7bb9"/>
  <circle cx="279" cy="154" r="4" fill="#2b7bb9"/>
  <circle cx="343" cy="174" r="4" fill="#2b7bb9"/>
  <circle cx="406" cy="192" r="4" fill="#2b7bb9"/>
  <circle cx="532" cy="222" r="4" fill="#2b7bb9"/>
  <circle cx="658" cy="247" r="4" fill="#2b7bb9"/>
  <text class="num" x="123" y="81">$725</text>
  <text class="num" x="351" y="166">$572</text>
  <text class="num" x="666" y="239">$442</text>
  <text class="cap" x="105" y="290">13.4</text>
  <text class="cap" x="269" y="290">16</text>
  <text class="cap" x="396" y="290">18</text>
  <text class="cap" x="522" y="290">20</text>
  <text class="cap" x="648" y="290">22</text>
  <text class="cap" x="350.0" y="308">SEER2 rating</text>
  <text class="cap" x="32" y="76">$/yr</text>
  <rect x="470" y="82" width="298" height="74" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="486" y="108">13.4 to 14.3: saves $45 a year</text>
  <text class="cap" x="486" y="130">20 to 22, more than twice the step:</text>
  <text class="cap" x="486" y="148">saves $44</text>
  <text class="cap" x="32" y="334">3 tons, 1,500 full-load hours, 18 cents per kWh. Energy use falls with the inverse of the rating.</text>
</svg>
