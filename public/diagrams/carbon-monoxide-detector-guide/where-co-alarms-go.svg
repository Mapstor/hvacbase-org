<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800" height="408" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where carbon monoxide alarms go in a two-story house with a basement</title>
  <desc id="d">A two-story house with a basement and an attached garage, with CO alarms in the basement, on the main floor and in the upstairs hallway outside the bedrooms. One alarm goes on every level and outside every sleeping area; mounting height doesn't matter because CO mixes evenly with air; keep alarms a little away from furnaces and fireplaces; cover living space next to an attached garage. This house needs at least three.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    @keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
    @media (prefers-reduced-motion: reduce){.ping{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="408" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Where CO alarms go</text>
  <path d="M26 100 L212 60 L398 100" stroke="#8aa1b4" stroke-width="2" fill="none"/>
  <rect x="32" y="100" width="360" height="86" rx="0" fill="#f7f9fb" stroke="#8aa1b4"/>
  <text class="cap" x="44" y="122">Upstairs: bedrooms</text>
  <rect x="32" y="186" width="360" height="86" rx="0" fill="#f7f9fb" stroke="#8aa1b4"/>
  <text class="cap" x="44" y="208">Main floor</text>
  <rect x="32" y="272" width="360" height="86" rx="0" fill="#eef1f4" stroke="#8aa1b4"/>
  <text class="cap" x="44" y="294">Basement</text>
  <rect x="222" y="136" width="58" height="48" rx="2" fill="#ffffff" stroke="#c9d8e5"/>
  <rect x="294" y="136" width="58" height="48" rx="2" fill="#ffffff" stroke="#c9d8e5"/>
  <circle cx="182" cy="158" r="9" fill="#c2410c"/>
  <circle cx="182" cy="158" r="15" fill="none" stroke="#c2410c" stroke-width="1.5" class="ping"/>
  <circle cx="182" cy="236" r="9" fill="#c2410c"/>
  <circle cx="182" cy="236" r="15" fill="none" stroke="#c2410c" stroke-width="1.5" class="ping"/>
  <circle cx="182" cy="322" r="9" fill="#c2410c"/>
  <circle cx="182" cy="322" r="15" fill="none" stroke="#c2410c" stroke-width="1.5" class="ping"/>
  <rect class="solid" x="314" y="302" width="46" height="46" rx="3" fill="#efe3d6" stroke="#b08968"/>
  <text class="cap" x="258" y="294">Furnace</text>
  <rect x="392" y="186" width="110" height="86" rx="0" fill="#f3f3f3" stroke="#9aa5ae"/>
  <text class="cap" x="404" y="208">Attached</text>
  <text class="cap" x="404" y="224">garage</text>
  <rect x="528" y="64" width="240" height="96" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="544" y="90">One on every level</text>
  <text class="cap" x="544" y="112">Including the basement and any</text>
  <text class="cap" x="544" y="130">floor with a fuel-burning</text>
  <text class="cap" x="544" y="148">appliance</text>
  <rect x="528" y="172" width="240" height="60" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="544" y="198">Outside every sleeping area</text>
  <text class="cap" x="544" y="220">Loud enough to wake you</text>
  <rect x="528" y="244" width="240" height="96" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="544" y="270">Any mounting height</text>
  <text class="cap" x="544" y="292">CO mixes evenly with the air</text>
  <text class="cap" x="544" y="310">Keep alarms a little away from</text>
  <text class="cap" x="544" y="328">furnaces and fireplaces</text>
  <text class="cap" x="32" y="388">Cover living space next to an attached garage. This house needs at least three alarms.</text>
</svg>
