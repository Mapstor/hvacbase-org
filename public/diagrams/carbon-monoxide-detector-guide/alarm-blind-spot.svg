<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The low-level blind spot in a standard UL 2034 carbon monoxide alarm</title>
  <desc id="d">A carbon monoxide scale in parts per million: below 30 ppm a UL 2034 alarm must stay silent; between 30 and 70 ppm it can stay quiet for hours, which is too long for children, pregnant women or people with heart disease; at 70 ppm it must sound within 60 to 240 minutes, at 150 within 10 to 50 and at 400 within 4 to 15. A low-level monitor shows the reading sooner.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="330" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">The blind spot in a standard CO alarm</text>
  <rect class="solid" x="32" y="70" width="138" height="40" rx="0" fill="#e7ecf0" stroke="#ffffff"/>
  <rect class="solid" x="170" y="70" width="184" height="40" rx="0" fill="#f6cfb4" stroke="#ffffff"/>
  <rect class="solid" x="354" y="70" width="414" height="40" rx="0" fill="#efb3a0" stroke="#ffffff"/>
  <text class="cap" x="32" y="130">0 ppm</text>
  <text class="cap" x="160" y="130">30 ppm</text>
  <text class="cap" x="344" y="130">70 ppm</text>
  <text class="cap" x="712" y="130">150 ppm</text>
  <rect x="32" y="152" width="232" height="128" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="48" y="178">Below 30 ppm</text>
  <text class="cap" x="48" y="200">A UL 2034 alarm must</text>
  <text class="cap" x="48" y="218">stay silent, by design,</text>
  <text class="cap" x="48" y="236">to avoid nuisance alarms</text>
  <rect x="284" y="152" width="232" height="128" rx="10" fill="#fbe3d8" stroke="#e8b39a"/>
  <text class="num" x="300" y="178">30 to 70 ppm</text>
  <text class="cap" x="300" y="200">The blind spot: it can</text>
  <text class="cap" x="300" y="218">stay quiet for hours,</text>
  <text class="cap" x="300" y="236">too long for children,</text>
  <text class="cap" x="300" y="254">pregnancy or heart disease</text>
  <rect x="536" y="152" width="232" height="128" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="552" y="178">70 ppm and up</text>
  <text class="cap" x="552" y="200">Alarm within 60 to 240 min</text>
  <text class="cap" x="552" y="218">at 70 ppm, 10 to 50 min</text>
  <text class="cap" x="552" y="236">at 150, 4 to 15 at 400</text>
  <text class="cap" x="32" y="310">A low-level CO monitor shows the reading before a standard alarm would sound.</text>
</svg>
