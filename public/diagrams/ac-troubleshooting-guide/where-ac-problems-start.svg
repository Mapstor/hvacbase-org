<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where air conditioner problems usually start</title>
  <desc id="d">Three parts of an AC system and the symptoms each causes: thermostat and power (breaker, disconnect, thermostat) cause an AC that won't turn on or short-cycles; the indoor unit (filter, blower and vents, indoor coil, condensate drain) causes weak cooling, freezing and water leaks; the outdoor unit (coil, fan and compressor, refrigerant lines) causes poor cooling, noises and high bills.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="420" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Where AC problems usually start</text>
  <rect x="32" y="62" width="232" height="150" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="48" y="88">Thermostat and power</text>
  <text class="cap" x="48" y="110">Breaker or disconnect</text>
  <text class="cap" x="48" y="128">Thermostat settings,</text>
  <text class="cap" x="48" y="146">batteries, location</text>
  <rect x="32" y="226" width="232" height="104" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="48" y="252">Symptoms</text>
  <text class="cap" x="48" y="274">Won't turn on</text>
  <text class="cap" x="48" y="292">Short-cycling</text>
  <rect x="280" y="62" width="232" height="150" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="296" y="88">Indoor unit</text>
  <text class="cap" x="296" y="110">Air filter</text>
  <text class="cap" x="296" y="128">Blower and vents</text>
  <text class="cap" x="296" y="146">Indoor coil</text>
  <text class="cap" x="296" y="164">Condensate drain line</text>
  <rect x="280" y="226" width="232" height="104" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="296" y="252">Symptoms</text>
  <text class="cap" x="296" y="274">Weak cooling</text>
  <text class="cap" x="296" y="292">Freezing up</text>
  <text class="cap" x="296" y="310">Leaking water</text>
  <rect x="528" y="62" width="232" height="150" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="544" y="88">Outdoor unit</text>
  <text class="cap" x="544" y="110">Outdoor coil</text>
  <text class="cap" x="544" y="128">Fan and compressor</text>
  <text class="cap" x="544" y="146">Refrigerant lines</text>
  <rect x="528" y="226" width="232" height="104" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="544" y="252">Symptoms</text>
  <text class="cap" x="544" y="274">Not cooling</text>
  <text class="cap" x="544" y="292">Strange noises</text>
  <text class="cap" x="544" y="310">High bills</text>
  <rect x="32" y="346" width="736" height="56" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="cap" x="48" y="372">Start with the free checks: power, thermostat, filter and drain line.</text>
  <text class="cap" x="48" y="390">Refrigerant, compressor and electrical repairs are jobs for a licensed technician.</text>
</svg>
