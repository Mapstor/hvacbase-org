<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 398" width="800" height="398" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a compressor dehumidifier removes moisture from the air</title>
  <desc id="d">Humid room air passes over a cold coil, where it drops below its dew point and water condenses into a bucket or drain; the air then passes a warm coil and leaves drier and slightly warmer. Compressor units work best above about 65 degrees; desiccant models suit cold spaces below 50 degrees.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .air{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}
    .drip{stroke-dasharray:4 4;animation:flow 0.9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @media (prefers-reduced-motion: reduce){.air,.drip{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="398" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">How a compressor dehumidifier works</text>
  <rect class="solid" x="250" y="70" width="300" height="150" rx="8" fill="#ffffff" stroke="#8aa1b4"/>
  <polyline points="290,86 314,96 290,106 314,116 290,126 314,136 290,146 314,156" fill="none" stroke="#2b7bb9" stroke-width="3"/>
  <polyline points="470,86 494,96 470,106 494,116 470,126 494,136 470,146 494,156" fill="none" stroke="#e07a2f" stroke-width="3"/>
  <path class="drip" d="M296 166 V182" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <path class="drip" d="M304 166 V182" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <path class="drip" d="M312 166 V182" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <path d="M276 186 H332 L328 210 H280 Z" fill="#d8e7f4" stroke="#5b9bd5" stroke-width="1.5"/>
  <path class="air" d="M70 120 H246" stroke="#5b9bd5" stroke-width="3" fill="none"/>
  <path d="M238 114 L248 120 L238 126 Z" fill="#5b9bd5"/>
  <path class="air" d="M554 120 H730" stroke="#e07a2f" stroke-width="3" fill="none"/>
  <path d="M722 114 L732 120 L722 126 Z" fill="#e07a2f"/>
  <text class="lbl" x="70" y="104">Humid room air in</text>
  <text class="lbl" x="580" y="104">Drier air out,</text>
  <text class="lbl" x="580" y="146">slightly warmer</text>
  <text class="num" x="262" y="240">1. Cold coil</text>
  <text class="cap" x="262" y="258">Air drops below its dew</text>
  <text class="cap" x="262" y="274">point; water condenses</text>
  <text class="num" x="440" y="240">2. Warm coil</text>
  <text class="cap" x="440" y="258">Reheats the dried air</text>
  <text class="cap" x="262" y="300">3. Water collects in a bucket or drains through a hose</text>
  <rect x="32" y="322" width="736" height="58" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="cap" x="48" y="348">Works best above about 65°F; below that the coil can ice, so a cold basement needs auto-defrost.</text>
  <text class="cap" x="48" y="366">Desiccant models suit cold spaces below 50°F, such as garages and crawl spaces.</text>
</svg>
