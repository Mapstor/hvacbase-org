<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How a central air conditioner moves heat out of your home</title>
  <desc id="d">Warm room air passes through the filter and over the indoor coil, where cold refrigerant absorbs its heat. The refrigerant carries that heat through copper lines to the outdoor unit, where the compressor and outdoor coil release it outside. The four quick checks are marked: 1 the filter, 2 the outdoor coil, 3 the thermostat, 4 the supply vents.</desc>
  <style>
    .lbl{font-size:13px;fill:#33475b}
    .zone{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#6b7f91}
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .key{font-size:13px;fill:#1d2b38}
    .chk{font-size:14px;font-weight:700;fill:#c2410c}
    .flow{stroke-dasharray:10 8;animation:flow 1.4s linear infinite}
    .air{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
    .rise{animation:rise 2.4s ease-in-out infinite}
    .r2{animation-delay:.8s}.r3{animation-delay:1.6s}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes rise{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.flow,.air,.rise{animation:none}.rise{opacity:1}}
  </style>
  <rect x="0" y="0" width="800" height="470" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="42">How a central AC moves heat out of your home</text>

  <rect x="32" y="64" width="404" height="318" rx="12" fill="#f3f7fb" stroke="#d4e0ea"/>
  <rect x="468" y="64" width="300" height="318" rx="12" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="zone" x="48" y="86">INDOOR</text>
  <text class="zone" x="484" y="86">OUTDOOR</text>

  <!-- thermostat, upper left -->
  <rect class="solid" x="52" y="104" width="22" height="32" rx="3" fill="#ffffff" stroke="#6b7f91"/>
  <circle cx="63" cy="116" r="5" fill="none" stroke="#6b7f91"/>
  <text class="chk" x="84" y="125">③</text>
  <text class="lbl" x="102" y="125">Thermostat</text>

  <!-- supply register and vents -->
  <rect class="solid" x="200" y="108" width="60" height="8" rx="2" fill="#9fb3c4"/>
  <path class="air" d="M230 158 V124" stroke="#2b7bb9" stroke-width="3" fill="none"/>
  <path d="M224 130 L230 120 L236 130 Z" fill="#2b7bb9"/>
  <text class="chk" x="272" y="116">④</text>
  <text class="lbl" x="290" y="116">Supply vents</text>
  <text class="lbl" x="272" y="134">Cooled air to rooms</text>

  <!-- air handler -->
  <rect class="solid" x="170" y="160" width="120" height="170" rx="6" fill="#ffffff" stroke="#8aa1b4" stroke-width="1.5"/>
  <polyline points="182,176 194,196 206,176 218,196 230,176 242,196 254,176 266,196 278,176" fill="none" stroke="#2b7bb9" stroke-width="2.5"/>
  <circle cx="230" cy="288" r="22" fill="none" stroke="#8aa1b4" stroke-width="1.5"/>
  <path d="M230 288 L230 270 M230 288 L245 297 M230 288 L215 297" stroke="#8aa1b4" stroke-width="1.5"/>
  <rect class="solid" x="156" y="250" width="12" height="72" rx="2" fill="#e8c77d" stroke="#b8953f"/>
  <text class="chk" x="96" y="240">①</text>
  <text class="lbl" x="114" y="240">Filter</text>
  <path class="air" d="M50 300 H150" stroke="#d97706" stroke-width="3" fill="none"/>
  <path d="M144 294 L154 300 L144 306 Z" fill="#d97706"/>
  <text class="lbl" x="50" y="288">Warm room air</text>
  <text class="lbl" x="152" y="356">Indoor coil absorbs the heat</text>

  <!-- refrigerant lines -->
  <path class="flow" d="M290 186 H560" stroke="#2b7bb9" stroke-width="4" fill="none"/>
  <path class="flow" d="M560 226 H290" stroke="#e07a2f" stroke-width="4" fill="none"/>
  <text class="lbl" x="300" y="256">Refrigerant loop carries</text>
  <text class="lbl" x="300" y="274">the heat outside</text>

  <!-- outdoor unit -->
  <rect class="solid" x="560" y="160" width="150" height="160" rx="6" fill="#ffffff" stroke="#b08968" stroke-width="1.5"/>
  <circle cx="635" cy="196" r="24" fill="none" stroke="#b08968" stroke-width="1.5"/>
  <path d="M635 196 L635 174 M635 196 L654 207 M635 196 L616 207" stroke="#b08968" stroke-width="1.5"/>
  <polyline points="574,236 590,246 574,256 590,266 574,276 590,286 574,296 590,306" fill="none" stroke="#e07a2f" stroke-width="2.5"/>
  <rect class="solid" x="612" y="262" width="70" height="40" rx="4" fill="#efe3d6" stroke="#b08968"/>
  <g fill="none" stroke="#e07a2f" stroke-width="2.5" stroke-linecap="round">
    <path class="rise" d="M612 150 q6 -8 0 -16 q-6 -8 0 -16"/>
    <path class="rise r2" d="M635 150 q6 -8 0 -16 q-6 -8 0 -16"/>
    <path class="rise r3" d="M658 150 q6 -8 0 -16 q-6 -8 0 -16"/>
  </g>
  <text class="lbl" x="566" y="108">Heat released outside</text>
  <text class="chk" x="560" y="346">②</text>
  <text class="lbl" x="578" y="346">Outdoor coil</text>
  <text class="lbl" x="630" y="370">Compressor</text>
  <path d="M664 356 V304" stroke="#b08968" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- key -->
  <text class="key" x="32" y="420">The four quick checks, in order:</text>
  <text class="chk" x="32" y="446">①</text><text class="key" x="50" y="446">filter</text>
  <text class="chk" x="104" y="446">②</text><text class="key" x="122" y="446">outdoor coil</text>
  <text class="chk" x="222" y="446">③</text><text class="key" x="240" y="446">thermostat</text>
  <text class="chk" x="326" y="446">④</text><text class="key" x="344" y="446">supply vents</text>
</svg>
