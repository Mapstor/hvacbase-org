<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" width="800" height="332" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Which MERV filter rating suits which home</title>
  <desc id="d">MERV 8 is the sensible default for dust, pollen and pet dander; MERV 11 suits homes with pets, mild allergies or a smoker; MERV 13 suits allergies, asthma and wildfire smoke if the system can handle it; MERV 14 to 16 is hospital territory and not for typical home systems.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="332" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Which MERV for which home</text>
  <rect x="32" y="150" width="178" height="96" rx="10" fill="#e6f4e9" stroke="#9cc59c"/>
  <text class="num" x="48" y="176">MERV 8</text>
  <text class="cap" x="48" y="198">The sensible default</text>
  <text class="cap" x="48" y="216">Dust, pollen, dander</text>
  <rect x="216" y="122" width="178" height="124" rx="10" fill="#e8f1fa" stroke="#9fbfdc"/>
  <text class="num" x="232" y="148">MERV 11</text>
  <text class="cap" x="232" y="170">Pets, mild allergies,</text>
  <text class="cap" x="232" y="188">or a smoker at home</text>
  <rect x="400" y="94" width="178" height="152" rx="10" fill="#d9e8f6" stroke="#2b7bb9"/>
  <text class="num" x="416" y="120">MERV 13</text>
  <text class="cap" x="416" y="142">Allergies, asthma,</text>
  <text class="cap" x="416" y="160">wildfire smoke, if</text>
  <text class="cap" x="416" y="178">the system can take it</text>
  <rect x="584" y="66" width="178" height="180" rx="10" fill="#fbe3d8" stroke="#e8b39a"/>
  <text class="num" x="600" y="92">MERV 14 to 16</text>
  <text class="cap" x="600" y="114">Hospital territory:</text>
  <text class="cap" x="600" y="132">not for typical</text>
  <text class="cap" x="600" y="150">home systems</text>
  <text class="cap" x="32" y="292">More filtration to the right; MERV 14 to 16 usually restrict airflow in home systems.</text>
  <text class="cap" x="32" y="312">Match your situation, not the biggest number.</text>
</svg>
