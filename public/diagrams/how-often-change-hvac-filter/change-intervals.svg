<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How often to change 1-inch, 2-inch and 4 to 5-inch HVAC filters</title>
  <desc id="d">Typical change intervals: a 1-inch fiberglass or pleated filter every 1 to 3 months, a 2-inch pleated filter every 3 to 6 months and a 4 to 5-inch deep media filter every 6 to 12 months. ENERGY STAR advises checking monthly and changing a standard filter at least every 3 months.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .bars rect{transform-box:fill-box;transform-origin:left center;animation:grow .8s ease-out both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.bars rect{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="360" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">How often to change an HVAC filter</text>
  <g class="bars">
  <rect class="solid" x="264" y="78" width="68" height="26" rx="3" fill="#2b7bb9" stroke="none" style="animation-delay:0.0s"/>
  <rect class="solid" x="332" y="128" width="102" height="26" rx="3" fill="#2b7bb9" stroke="none" style="animation-delay:0.1s"/>
  <rect class="solid" x="434" y="178" width="204" height="26" rx="3" fill="#2b7bb9" stroke="none" style="animation-delay:0.2s"/>
  </g>
  <text class="lbl" x="32" y="96">1-inch fiberglass or pleated</text>
  <text class="num" x="342" y="96">every 1-3 months</text>
  <text class="lbl" x="32" y="146">2-inch pleated</text>
  <text class="num" x="444" y="146">every 3-6 months</text>
  <text class="lbl" x="32" y="196">4 to 5-inch deep media</text>
  <text class="num" x="648" y="196">every 6-12 months</text>
  <text class="cap" x="230" y="246">0</text>
  <text class="cap" x="326" y="246">3</text>
  <text class="cap" x="428" y="246">6</text>
  <text class="cap" x="530" y="246">9</text>
  <text class="cap" x="632" y="246">12</text>
  <text class="cap" x="400" y="264">months</text>
  <rect x="32" y="284" width="736" height="56" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="cap" x="48" y="310">ENERGY STAR: check the filter every month, and change a standard 1-inch filter at least every</text>
  <text class="cap" x="48" y="328">3 months even if it looks clean. Thicker filters hold more dust before they clog.</text>
</svg>
