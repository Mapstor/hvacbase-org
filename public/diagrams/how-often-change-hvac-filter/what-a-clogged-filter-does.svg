<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What a clogged HVAC filter does to energy use, equipment and the cooling coil</title>
  <desc id="d">A clogged filter cuts airflow, so the system runs longer and dust builds up inside it. The results: more energy, since a clean filter can lower an air conditioner's energy use by 5 to 15 percent according to the DOE; more wear and costly maintenance, per ENERGY STAR; and in summer a frozen coil that can damage the compressor.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="330" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">What a clogged filter does</text>
  <rect x="32" y="62" width="232" height="96" rx="10" fill="#fbe3d8" stroke="#e8b39a"/>
  <text class="num" x="48" y="88">Clogged filter</text>
  <text class="cap" x="48" y="110">Dust fills the media</text>
  <text class="cap" x="48" y="128">and airflow drops</text>
  <path d="M266 110 H292" stroke="#6b7f91" stroke-width="2" fill="none"/>
  <path d="M291 104 L298 110 L291 116 Z" fill="#6b7f91"/>
  <rect x="300" y="62" width="468" height="96" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="num" x="316" y="88">The system works harder for the same result</text>
  <text class="cap" x="316" y="110">Longer run times to move the same air</text>
  <text class="cap" x="316" y="128">Dust builds up inside the equipment</text>
  <rect x="32" y="180" width="232" height="100" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="48" y="206">More energy</text>
  <text class="cap" x="48" y="228">A clean filter can lower</text>
  <text class="cap" x="48" y="246">an AC's energy use 5-15%</text>
  <text class="cap" x="48" y="264">(DOE)</text>
  <rect x="280" y="180" width="232" height="100" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="296" y="206">More wear</text>
  <text class="cap" x="296" y="228">Dust inside the equipment</text>
  <text class="cap" x="296" y="246">can mean expensive</text>
  <text class="cap" x="296" y="264">maintenance (ENERGY STAR)</text>
  <rect x="528" y="180" width="232" height="100" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="544" y="206">Frozen coil</text>
  <text class="cap" x="544" y="228">In summer, low airflow can</text>
  <text class="cap" x="544" y="246">ice the coil and damage</text>
  <text class="cap" x="544" y="264">the compressor</text>
  <text class="cap" x="32" y="310">A filter costs a few dollars; the system it protects costs thousands.</text>
</svg>
