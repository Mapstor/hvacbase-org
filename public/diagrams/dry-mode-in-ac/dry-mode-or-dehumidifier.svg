<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">When AC dry mode is enough and when you need a dehumidifier</title>
  <desc id="d">AC dry mode is a light-duty setting that takes the edge off a muggy room, removes moisture slowly and is tied to cooling, so it suits humid, mild days. A standalone dehumidifier controls humidity independently of temperature and is the tool for a basement that never dries, a crawlspace, condensation on walls or water damage.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="312" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Dry mode or a dehumidifier?</text>
  <rect x="32" y="62" width="360" height="200" rx="10" fill="#e8f1fa" stroke="#9fbfdc"/>
  <text class="num" x="48" y="88">AC dry mode</text>
  <text class="cap" x="48" y="112">A light-duty humidity setting</text>
  <text class="cap" x="48" y="130">Takes the edge off a muggy room</text>
  <text class="cap" x="48" y="148">Removes moisture slowly</text>
  <text class="cap" x="48" y="166">Tied to cooling: it can't control</text>
  <text class="cap" x="48" y="184">humidity on its own</text>
  <text class="cap" x="48" y="202">Good for: humid, mild days</text>
  <rect x="408" y="62" width="360" height="200" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="424" y="88">A standalone dehumidifier</text>
  <text class="cap" x="424" y="112">Built to pull moisture out</text>
  <text class="cap" x="424" y="130">Controls humidity independently</text>
  <text class="cap" x="424" y="148">of temperature</text>
  <text class="cap" x="424" y="166">Good for: a basement that never</text>
  <text class="cap" x="424" y="184">dries, a crawlspace, condensation</text>
  <text class="cap" x="424" y="202">on walls, after water damage</text>
  <text class="cap" x="32" y="292">Dry mode isn't a substitute for a dehumidifier in a genuinely damp space.</text>
</svg>
