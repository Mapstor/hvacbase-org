<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Central air with ducts compared with a ductless mini split</title>
  <desc id="d">Central air sends conditioned air from an air handler through ducts to registers in every room, and ducts can leak some of the cooling. A mini split runs refrigerant lines from an outdoor unit to a head mounted in each room, with no ducts.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .air{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion: reduce){.air{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="360" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Central air vs. mini split: it comes down to ducts</text>
  <rect x="32" y="62" width="360" height="250" rx="12" fill="#f3f7fb" stroke="#d4e0ea"/>
  <text class="zone" x="48" y="86">CENTRAL AIR</text>
  <rect x="408" y="62" width="360" height="250" rx="12" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="zone" x="424" y="86">MINI SPLIT</text>
  <rect class="solid" x="60" y="200" width="70" height="80" rx="4" fill="#ffffff" stroke="#8aa1b4"/>
  <text class="cap" x="52" y="298">Air handler</text>
  <path class="air" d="M130 220 H340" stroke="#2b7bb9" stroke-width="3" fill="none"/>
  <path class="air" d="M190 220 V140" stroke="#2b7bb9" stroke-width="3" fill="none"/>
  <rect class="solid" x="172" y="124" width="36" height="8" rx="2" fill="#9fb3c4" stroke="none"/>
  <path class="air" d="M260 220 V140" stroke="#2b7bb9" stroke-width="3" fill="none"/>
  <rect class="solid" x="242" y="124" width="36" height="8" rx="2" fill="#9fb3c4" stroke="none"/>
  <path class="air" d="M330 220 V140" stroke="#2b7bb9" stroke-width="3" fill="none"/>
  <rect class="solid" x="312" y="124" width="36" height="8" rx="2" fill="#9fb3c4" stroke="none"/>
  <text class="cap" x="150" y="112">Ducts to every room</text>
  <text class="cap" x="150" y="250">Ducts can leak, losing</text>
  <text class="cap" x="150" y="268">some of the cooling</text>
  <rect class="solid" x="430" y="230" width="70" height="56" rx="4" fill="#ffffff" stroke="#b08968"/>
  <text class="cap" x="424" y="304">Outdoor unit</text>
  <path d="M500 258 H740" stroke="#e07a2f" stroke-width="2" fill="none"/>
  <path d="M560 258 V150" stroke="#e07a2f" stroke-width="2" fill="none"/>
  <rect class="solid" x="530" y="130" width="60" height="20" rx="6" fill="#ffffff" stroke="#b08968"/>
  <path d="M640 258 V150" stroke="#e07a2f" stroke-width="2" fill="none"/>
  <rect class="solid" x="610" y="130" width="60" height="20" rx="6" fill="#ffffff" stroke="#b08968"/>
  <path d="M720 258 V150" stroke="#e07a2f" stroke-width="2" fill="none"/>
  <rect class="solid" x="690" y="130" width="60" height="20" rx="6" fill="#ffffff" stroke="#b08968"/>
  <text class="cap" x="530" y="112">A head in each room, no ducts</text>
  <text class="cap" x="424" y="184">Refrigerant</text>
  <text class="cap" x="424" y="202">lines only</text>
  <text class="cap" x="32" y="340">Central air pushes air through ducts to every room; a mini split cools each room from a unit on its wall.</text>
</svg>
