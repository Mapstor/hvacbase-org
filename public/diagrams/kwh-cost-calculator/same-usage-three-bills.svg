<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" width="800" height="292" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Monthly electric bill for the average home in North Dakota, the U.S. average and Hawaii</title>
  <desc id="d">At the average U.S. home's 863 kWh a month, the bill is about $107 in North Dakota at 12.36 cents per kWh, $157 at the U.S. average of 18.19 cents and $399 in Hawaii at 46.28 cents.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .bars rect{transform-box:fill-box;transform-origin:left center;animation:grow .8s ease-out both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.bars rect{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="292" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">The same 863 kWh a month, three different bills</text>
  <g class="bars">
  <rect class="solid" x="190" y="78" width="107" height="28" rx="3" fill="#3f8f5a" stroke="none" style="animation-delay:0.0s"/>
  <rect class="solid" x="190" y="136" width="157" height="28" rx="3" fill="#2b7bb9" stroke="none" style="animation-delay:0.1s"/>
  <rect class="solid" x="190" y="194" width="399" height="28" rx="3" fill="#c2410c" stroke="none" style="animation-delay:0.2s"/>
  </g>
  <text class="num" x="32" y="97">North Dakota</text>
  <text class="num" x="307" y="92">$107 a month</text>
  <text class="cap" x="307" y="108">12.36 cents per kWh</text>
  <text class="num" x="32" y="155">U.S. average</text>
  <text class="num" x="357" y="150">$157 a month</text>
  <text class="cap" x="357" y="166">18.19 cents per kWh</text>
  <text class="num" x="32" y="213">Hawaii</text>
  <text class="num" x="599" y="208">$399 a month</text>
  <text class="cap" x="599" y="224">46.28 cents per kWh</text>
  <text class="cap" x="32" y="272">863 kWh is the average U.S. home's monthly use (EIA, 2024). Rates: EIA averages, January to July 2026.</text>
</svg>
