<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Dehumidifier capacity by dampness and floor area</title>
  <desc id="d">ENERGY STAR's minimum portable dehumidifier capacities: under 2,000 square feet, 20 to 30 pints per day for a slightly to moderately damp space, 25 to 40 for a very damp one and 30 to 50 for a wet one; over 2,000 square feet, 30, 40 and 50 pints or more.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}
    .bars rect{transform-box:fill-box;transform-origin:left center;animation:grow .8s ease-out both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.bars rect{animation:none}}
  </style>
  <rect x="0" y="0" width="800" height="370" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Dehumidifier size by how damp the space is</text>
  <rect x="32" y="56" width="14" height="14" rx="3" fill="#2b7bb9" stroke="none"/>
  <text class="cap" x="52" y="68">Under 2,000 sq ft</text>
  <rect x="200" y="56" width="14" height="14" rx="3" fill="#e07a2f" stroke="none"/>
  <text class="cap" x="220" y="68">Over 2,000 sq ft (minimum)</text>
  <g class="bars">
  <rect class="solid" x="420" y="96" width="70" height="16" rx="3" fill="#2b7bb9" stroke="none"/>
  <rect class="solid" x="490" y="118" width="14" height="16" rx="3" fill="#e07a2f" stroke="none"/>
  <rect class="solid" x="455" y="158" width="105" height="16" rx="3" fill="#2b7bb9" stroke="none"/>
  <rect class="solid" x="560" y="180" width="14" height="16" rx="3" fill="#e07a2f" stroke="none"/>
  <rect class="solid" x="490" y="220" width="140" height="16" rx="3" fill="#2b7bb9" stroke="none"/>
  <rect class="solid" x="630" y="242" width="14" height="16" rx="3" fill="#e07a2f" stroke="none"/>
  </g>
  <text class="num" x="32" y="110">Slightly to moderately damp</text>
  <text class="cap" x="32" y="128">50-75% RH</text>
  <text class="cap" x="498" y="109">20-30 pints/day</text>
  <text class="cap" x="512" y="131">30 or more</text>
  <text class="num" x="32" y="172">Very damp</text>
  <text class="cap" x="32" y="190">75-90% RH</text>
  <text class="cap" x="568" y="171">25-40 pints/day</text>
  <text class="cap" x="582" y="193">40 or more</text>
  <text class="num" x="32" y="234">Wet</text>
  <text class="cap" x="32" y="252">90-100% RH</text>
  <text class="cap" x="638" y="233">30-50 pints/day</text>
  <text class="cap" x="652" y="255">50 or more</text>
  <text class="cap" x="280" y="306">0</text>
  <text class="cap" x="414" y="306">20</text>
  <text class="cap" x="554" y="306">40</text>
  <text class="cap" x="694" y="306">60</text>
  <text class="cap" x="430" y="324">pints per day</text>
  <text class="cap" x="32" y="350">Minimum capacities from ENERGY STAR's sizing chart for portable dehumidifiers.</text>
</svg>
