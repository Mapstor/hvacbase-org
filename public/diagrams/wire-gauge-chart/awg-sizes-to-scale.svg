<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">AWG copper wire sizes from 14 AWG to 1/0 drawn to scale</title>
  <desc id="d">Copper conductors drawn to scale from 14 AWG, 1.628 millimeters, through 12, 10, 8, 6, 4 and 2 AWG to 1/0, 8.252 millimeters. A smaller AWG number is a thicker wire: every 6 steps doubles the diameter and every 3 steps doubles the cross-section, and roughly the ampacity.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="330" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">AWG wire sizes, drawn to scale</text>
  <circle cx="74" cy="130" r="8.5" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="48" y="206">14 AWG</text>
  <text class="cap" x="48" y="224">1.628 mm</text>
  <circle cx="166" cy="130" r="10.7" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="140" y="206">12 AWG</text>
  <text class="cap" x="140" y="224">2.053 mm</text>
  <circle cx="258" cy="130" r="13.5" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="232" y="206">10 AWG</text>
  <text class="cap" x="232" y="224">2.588 mm</text>
  <circle cx="350" cy="130" r="17.0" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="324" y="206">8 AWG</text>
  <text class="cap" x="324" y="224">3.264 mm</text>
  <circle cx="442" cy="130" r="21.4" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="416" y="206">6 AWG</text>
  <text class="cap" x="416" y="224">4.115 mm</text>
  <circle cx="534" cy="130" r="27.0" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="508" y="206">4 AWG</text>
  <text class="cap" x="508" y="224">5.189 mm</text>
  <circle cx="626" cy="130" r="34.0" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="600" y="206">2 AWG</text>
  <text class="cap" x="600" y="224">6.544 mm</text>
  <circle cx="718" cy="130" r="42.9" fill="#c98a4b" stroke="#a36a33"/>
  <text class="num" x="692" y="206">1/0 AWG</text>
  <text class="cap" x="692" y="224">8.252 mm</text>
  <rect x="32" y="250" width="736" height="60" rx="10" fill="#f3f7fb" stroke="#c9d8e5"/>
  <text class="cap" x="48" y="276">Smaller number, thicker wire. Every 6 AWG steps doubles the diameter (14 to 8 AWG:</text>
  <text class="cap" x="48" y="294">1.63 to 3.26 mm); every 3 steps doubles the cross-section, and roughly the ampacity.</text>
</svg>
