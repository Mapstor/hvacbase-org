<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 258" width="800" height="258" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Why the same serial digits can mean two different dates</title>
  <desc id="d">The digits 1806 read as year plus month mean June 2018, but read as week plus year they mean week 18 of 2006, twelve years apart. Identify the brand's format first, and confirm with the manufacturer's lookup when the date matters.</desc>
  <style>
    .head{font-size:19px;font-weight:700;fill:#1d2b38}
    .num{font-size:13px;font-weight:700;fill:#1d2b38}
    .lbl{font-size:13px;fill:#33475b}
    .cap{font-size:12px;fill:#33475b}
    .big{font-size:16px;font-weight:700;fill:#2b7bb9}
    .zone{font-size:11px;font-weight:700;letter-spacing:1px;fill:#6b7f91}

  </style>
  <rect x="0" y="0" width="800" height="258" rx="14" fill="#ffffff"/>
  <text class="head" x="32" y="40">Same four digits, two different dates</text>
  <rect x="32" y="74" width="28" height="36" rx="4" fill="#d9e8f6" stroke="#9fb3c4"/>
  <text class="num" x="41" y="98">1</text>
  <rect x="64" y="74" width="28" height="36" rx="4" fill="#d9e8f6" stroke="#9fb3c4"/>
  <text class="num" x="73" y="98">8</text>
  <rect x="96" y="74" width="28" height="36" rx="4" fill="#fbe3d8" stroke="#9fb3c4"/>
  <text class="num" x="105" y="98">0</text>
  <rect x="128" y="74" width="28" height="36" rx="4" fill="#fbe3d8" stroke="#9fb3c4"/>
  <text class="num" x="137" y="98">6</text>
  <rect x="200" y="62" width="270" height="96" rx="10" fill="#e8f1fa" stroke="#9fbfdc"/>
  <text class="num" x="216" y="88">Read as YYMM</text>
  <text class="cap" x="216" y="110">Goodman, Amana, Daikin</text>
  <text class="cap" x="216" y="128">June 2018</text>
  <rect x="498" y="62" width="270" height="96" rx="10" fill="#fdf5ec" stroke="#eedcc7"/>
  <text class="num" x="514" y="88">Read as WWYY</text>
  <text class="cap" x="514" y="110">Carrier, Bryant, Payne, Lennox</text>
  <text class="cap" x="514" y="128">Week 18 of 2006</text>
  <text class="lbl" x="32" y="196">The same serial reads twelve years apart depending on the format.</text>
  <text class="cap" x="32" y="220">Identify the brand first, then apply its format. When the date matters for a warranty,</text>
  <text class="cap" x="32" y="238">confirm it with the manufacturer's product-registration lookup.</text>
</svg>
